name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Generated files, MCM JSON, FOMOD and payload hygiene
        run: python tools/check_package.py

  native:
    name: Native plugin (MSVC, host policy tests)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: vcpkg at the pinned baseline
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --no-tags https://github.com/microsoft/vcpkg.git $dir
          git -C $dir checkout 817892b0ecbc6af994dd6df999c73faf795adbf2
          & "$dir/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure, build, run policy tests
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NemesisCombatAI-dll
          path: build/Release/NemesisCombatAI.dll
          if-no-files-found: error
