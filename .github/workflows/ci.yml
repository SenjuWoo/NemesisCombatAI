name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Generated files, MCM JSON, FOMOD and payload hygiene
        run: python tools/check_package.py

  native:
    name: Native plugin (MSVC via xmake, policy tests, version block)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1.2.5
        with:
          xmake-version: latest
      - name: Configure and build (CommonLibSSE pin, static CRT)
        run: |
          xmake f -p windows -a x64 -m release -y
          xmake b -y
      - name: Host policy tests
        run: ./build/windows/x64/release/policy_tests.exe
      - name: Shipped version block declares the Address Library v5 contract
        shell: pwsh
        run: |
          $version = (Select-String -Path xmake.lua -Pattern 'set_version\("([^"]+)"\)').Matches[0].Groups[1].Value
          python tools/verify_version_block.py build/windows/x64/release/NemesisCombatAI.dll --expect-version $version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NemesisCombatAI-dll
          path: build/windows/x64/release/NemesisCombatAI.dll
          if-no-files-found: error
