; Nemesis Combat AI - Dynamic Grip integration (installed because DynamicGrip.esp was active).
; Dynamic Grip lets NPCs swap between one- and two-handed grips mid-fight. With this on, only schooled fighters
; (Trained tier or better, not casters) may do it, and a For Honor weapon master never does, so its For Honor
; movesets are not replaced. Remove this file to leave Dynamic Grip to every NPC; For Honor masters stay shielded either way.
[DynamicGrip]
GripTiers=1
