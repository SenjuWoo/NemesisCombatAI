; ══════════════════════════════════════════════════════════════════════════════
; Nemesis Combat AI — KID Weapon & Armor Tags
; ══════════════════════════════════════════════════════════════════════════════
; Matching strategy:
;   Weapons — vanilla WeapType* keywords. Every functional weapon (vanilla or
;   modded) carries one of these because animations and perks depend on them,
;   so keyword matching alone gives full coverage with ZERO false positives.
;   (The old EditorID wildcards were removed: "*Sword" also matched every
;   Greatsword, and "*Boots"/"*Gloves" tagged heavy plate as clothing.)
;
;   Armor — armor-class traits (HEAVY / LIGHT flags on the record itself) and
;   the ArmorClothing keyword. Trait matching is set by the engine per record,
;   so it also covers all modded armor automatically.
; ══════════════════════════════════════════════════════════════════════════════

; ─── FAST WEAPONS — daggers, swords, war axes ───────────────────────────────
; NPC reaction (runtime layer): fight defensively, respect the speed
Keyword = Nemesis_Weapon_Fast|Weapon|WeapTypeDagger|NONE|100
Keyword = Nemesis_Weapon_Fast|Weapon|WeapTypeSword|NONE|100
Keyword = Nemesis_Weapon_Fast|Weapon|WeapTypeWarAxe|NONE|100

; ─── HEAVY WEAPONS — greatswords, battleaxes, warhammers, maces ─────────────
; NPC reaction: punish recovery frames, do not trade blindly
Keyword = Nemesis_Weapon_Heavy|Weapon|WeapTypeGreatsword|NONE|100
Keyword = Nemesis_Weapon_Heavy|Weapon|WeapTypeBattleaxe|NONE|100
Keyword = Nemesis_Weapon_Heavy|Weapon|WeapTypeWarhammer|NONE|100
Keyword = Nemesis_Weapon_Heavy|Weapon|WeapTypeMace|NONE|100

; ─── RANGED WEAPONS — bows, crossbows ───────────────────────────────────────
; NPC reaction: close distance immediately
; (vanilla + almost all modded crossbows carry WeapTypeBow; the wildcard
;  catches the rare modded crossbow that only has a custom keyword)
Keyword = Nemesis_Weapon_Ranged|Weapon|WeapTypeBow|NONE|100
Keyword = Nemesis_Weapon_Ranged|Weapon|*Crossbow|NONE|100

; ─── MAGIC WEAPONS — staves ─────────────────────────────────────────────────
; NPC reaction: circle between casts, punish recovery
; (many vanilla staves lack WeapTypeStaff, hence the name-substring fallback too)
Keyword = Nemesis_Weapon_Magic|Weapon|WeapTypeStaff|NONE|100
Keyword = Nemesis_Weapon_Magic|Weapon|*Staff|NONE|100

; ══════════════════════════════════════════════════════════════════════════════
; ARMOR TAGS — armor class detection for counter-tactics
; ══════════════════════════════════════════════════════════════════════════════

; ─── HEAVY ARMOR — trait match (covers ALL heavy armor, any mod) ────────────
Keyword = Nemesis_Armor_Heavy|Armor|NONE|HEAVY|100

; ─── LIGHT ARMOR — trait match (covers ALL light armor, any mod) ────────────
Keyword = Nemesis_Armor_Light|Armor|NONE|LIGHT|100

; ─── CLOTHING / ROBES — keyword match ───────────────────────────────────────
Keyword = Nemesis_Armor_Cloth|Armor|ArmorClothing|NONE|100
