; ── 3.0.0 NOTE ────────────────────────────────────────────────────────────────
; With the "Full tactics" option, NemesisCombatAI_Styles.esp.ini (N...) runs BEFORE this file, so NPCs on the vanilla
; csHumanMeleeLvl1-7 styles are already restyled when these rules look at them: the Thalmor, Dremora and Silver Hand
; melee lines (and the Lvl entries of the Vampire line) then match nothing, and the Warlock/Necromancer caster
; lines are superseded by the native level grading of casters. They still apply in "Morale only" installs.
; ──────────────────────────────────────────────────────────────────────────────
; ══════════════════════════════════════════════════════════════════════════════
; Nemesis Combat AI — SkyPatcher faction combat-style layer
; Version 1.0.3 safety policy:
;   - NO load-time Aggression or Confidence edits.
;   - NO actor-class filters. Classes are stat templates and are routinely reused.
;   - NO broad race/keyword temperament filters.
;   - Only semantic faction membership selects NPCs.
;   - Only combat styles are changed, and only when the NPC already uses a
;     compatible vanilla melee/caster style.
;
; This layer therefore cannot make a peaceful NPC hostile or start combat.
; Runtime temperament adjustments remain reversible and only run after an NPC
; is already hostile to the player and already in combat.
;
; Division of labor with SkyTactics (if installed):
;   - SkyTactics handles generic humans, guards, soldiers, bandits, Forsworn,
;     Draugr, and similar broad groups. Nemesis no longer patches them here.
;   - Nemesis assigns themed pools only to factions SkyTactics does not cover:
;     Thalmor, Vampires, Dremora, Warlocks, Necromancers, and Silver Hand.
;   - restrictToCombatStyle prevents melee pools from replacing mage/archer
;     styles, and caster pools from replacing melee styles.
;   - ZZZ_ keeps this file after SkyTactics where both are installed.
;
; To disable: rename this file to .ini.bak
; ══════════════════════════════════════════════════════════════════════════════

; Vanilla melee styles used as compatibility guards:
; csHumanMeleeLvl1-7 = 0003BE1B, 00068848, 00068849, 00068847, 00086F4F,
;                      000E6C4F, 000E6C50

; ─── THALMOR — cunning melee pool ─────────────────────────────────────────────
filterByFactions=Skyrim.esm|00039F26:restrictToCombatStyle=Skyrim.esm|0003BE1B, Skyrim.esm|00068848, Skyrim.esm|00068849, Skyrim.esm|00068847, Skyrim.esm|00086F4F, Skyrim.esm|000E6C4F, Skyrim.esm|000E6C50:setRandomCombatStyle=NemesisCombatAI.esp|832

; ─── VAMPIRES — predatory melee pool ─────────────────────────────────────────
filterByFactions=Skyrim.esm|00027242:restrictToCombatStyle=Skyrim.esm|0003BE1B, Skyrim.esm|00068848, Skyrim.esm|00068849, Skyrim.esm|00068847, Skyrim.esm|00086F4F, Skyrim.esm|000E6C4F, Skyrim.esm|000E6C50, Skyrim.esm|0002DFB3:setRandomCombatStyle=NemesisCombatAI.esp|833

; ─── DREMORA — fearless melee pool ───────────────────────────────────────────
; Faction-only. The old ActorTypeDaedra keyword rule was intentionally removed
; because it also catches unrelated or mod-added Daedra.
filterByFactions=Skyrim.esm|00043597:restrictToCombatStyle=Skyrim.esm|0003BE1B, Skyrim.esm|00068848, Skyrim.esm|00068849, Skyrim.esm|00068847, Skyrim.esm|00086F4F, Skyrim.esm|000E6C4F, Skyrim.esm|000E6C50:setRandomCombatStyle=NemesisCombatAI.esp|836

; ─── WARLOCKS — tactical caster pool ─────────────────────────────────────────
filterByFactions=Skyrim.esm|00026724:restrictToCombatStyle=Skyrim.esm|0003BE1C, Skyrim.esm|00044CD0:setRandomCombatStyle=NemesisCombatAI.esp|838

; ─── NECROMANCERS — tactical caster pool ─────────────────────────────────────
filterByFactions=Skyrim.esm|00034B74:restrictToCombatStyle=Skyrim.esm|0003BE1C, Skyrim.esm|00044CD0:setRandomCombatStyle=NemesisCombatAI.esp|838

; ─── SILVER HAND — aggressive melee style pool ───────────────────────────────
; "Aggressive" here describes the style pool only. Native Aggression is kept.
filterByFactions=Skyrim.esm|000AA0A4:restrictToCombatStyle=Skyrim.esm|0003BE1B, Skyrim.esm|00068848, Skyrim.esm|00068849, Skyrim.esm|00068847, Skyrim.esm|00086F4F, Skyrim.esm|000E6C4F, Skyrim.esm|000E6C50:setRandomCombatStyle=NemesisCombatAI.esp|831
