; Nemesis Combat AI - core settings. An update overwrites this file, so put your own changes in a new file in this
; folder (for example 99-mine.ini): later file names win.
;
; Fleeing - how readily enemies may be pushed into running away.
;   rare   (default) Enemies fight like vanilla. Only a pack of untrained fighters whose leader fell, or who are
;                    clearly losing the crowd, may break and run, and only while someone is still fighting beside
;                    them. A lone survivor never runs. The mod gives their nerve back a few seconds after the
;                    moment passes.
;   never            This mod never makes an enemy run.
;   often            Ordinary pressure (a much higher-level foe, low health, being outnumbered) can also shake
;                    untrained fighters. Closer to 3.0.0-3.0.7 and much more running around: expect chases.
; Debug - 1 logs every verdict and release in NemesisCombatAI.log, not only the first 25.
[Core]
Fleeing=rare
Debug=0
